# cria o container sqlserver com a "versão" da image
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: econobr-sqlserver
    #prepara o ambiente
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: ${SA_PASSWORD}
      MSSQL_PID: ${MSSQL_PID}
    ports:
      - "1433:1433"
    #cria um volume e armazena os dados mesmo quando o container é apagado
    volumes:
      - mssql-data:/var/opt/mssql
    #reinicia o container se o docker reiniciar
    restart: unless-stopped

#identifica o volume para o docker gerenciar na seção
volumes:
  mssql-data: